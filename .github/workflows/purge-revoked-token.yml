name: Purge revoked credential

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and remove the old token from every commit
        run: |
          set -euo pipefail
          python -m pip install --quiet git-filter-repo

          LEAKED_TOKEN=""
          while IFS= read -r commit; do
            value="$(git show "$commit:jellyfin_main_screen.c" 2>/dev/null | sed -n 's/^#define JELLYFIN_TOKEN[[:space:]]*"\([0-9A-Fa-f]\{16,64\}\)".*/\1/p' | head -n 1 || true)"
            if [ -n "$value" ]; then
              LEAKED_TOKEN="$value"
              break
            fi
          done < <(git rev-list --all -- jellyfin_main_screen.c)

          if [ -z "$LEAKED_TOKEN" ]; then
            echo "No historical Jellyfin token found; nothing to rewrite."
            exit 0
          fi

          printf '%s==>[REVOKED_JELLYFIN_TOKEN]\n' "$LEAKED_TOKEN" > /tmp/replace.txt
          git filter-repo --force --replace-text /tmp/replace.txt

          git remote add origin https://github.com/vortigauntlet/JellyFin-PS3-LosslessAudio.git 2>/dev/null || true
          rm -f .github/workflows/purge-revoked-token.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: remove purge workflow" || true
          git push --force --all origin
          git push --force --tags origin
